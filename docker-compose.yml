# myPortfolio — services du site
# Usage :
#   docker compose --profile dev up -d    → conteneur de dev (scripting agentique)
#   docker compose --profile prod up -d   → site web + tunnel cloudflared (VPS)
# Variables d'environnement attendues (fichier .env non commité) :
#   TUNNEL_TOKEN=<jeton du tunnel Cloudflare>
name: my-portfolio

services:
  # ---- Environnement de développement normé (agents OpenCode, humains) ----
# Utilise la MÊME image que .devcontainer (LaTeX + Node + nvim + lazygit + opencode)
# et monte les MÊMES configs hôtes (nvim/LazyVim, lazygit, OpenCode).
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    user: dev
    # socket Docker hôte = root:root → groupe 0 pour l'utilisateur dev
    group_add: ["0"]
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.config/nvim:/home/dev/.config/nvim
      - ~/.local/share/nvim:/home/dev/.local/share/nvim
      - ~/.config/lazygit:/home/dev/.config/lazygit
      - ~/.config/opencode:/home/dev/.config/opencode
      - ~/.local/share/opencode:/home/dev/.local/share/opencode
    command: sleep infinity
    profiles: ["dev"]

  # ---- Site statique (production) ----
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-portfolio/web:latest
    restart: unless-stopped
    profiles: ["prod"]

  # ---- Tunnel Cloudflare : relie web au réseau Cloudflare, aucun port public ----
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    profiles: ["prod"]
    depends_on:
      - web
