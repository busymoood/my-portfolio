# myPortfolio — environnement de développement (dev container)
#
# Ce fichier ne sert QU'AU développement local : il construit l'image du
# devcontainer (LaTeX + Node + nvim + lazygit + opencode) et monte les configs
# de l'hôte.
#
# Le déploiement du site sur un VPS vit dans deploy/docker-compose.vps.yml.
#
# Usage :
#   docker compose up -d --build     → construit et démarre le conteneur
#   docker compose exec dev bash     → entre dans le conteneur
#   docker compose build dev         → rebuild après modification du Dockerfile

name: my-portfolio-dev

services:
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    user: dev
    # socket Docker hôte = root:root → groupe 0 pour l'utilisateur dev
    group_add: ["0"]
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.config/nvim:/home/dev/.config/nvim
      - ~/.local/share/nvim:/home/dev/.local/share/nvim
      - ~/.config/lazygit:/home/dev/.config/lazygit
      - ~/.config/opencode:/home/dev/.config/opencode
      - ~/.local/share/opencode:/home/dev/.local/share/opencode
    command: sleep infinity
