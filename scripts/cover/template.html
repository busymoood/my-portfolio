<!doctype html>
<!--
  Cover banner template — projects & post covers, 16:9 dark composition.

  Rendered by scripts/cover/make_cover.py with three placeholders:
    __TOKENS__   -> the --color-* custom properties of src/styles/tokens.css
                    (:root dark block), so the banner always matches the site.
    __CONFIG__   -> JSON payload from content/projects/<slug>/cover.json
                    (path, label, title, tagline, stats, status, footers and
                    the optional per-project `focalHtml` markup).
    __FONTS__    -> absolute file:// dir of public/fonts (IBM Plex, self-host).

  Layout rules (mobile legibility, see docs/spec.md):
    - the left column is limited to the essentials: title, tagline, <=3 stats;
    - the focal asset takes ~half the canvas so details stay readable when the
      card is displayed at ~400px wide on mobile.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, height=720">
<base href="__BASE__">
<style>
  @font-face {
    font-family: 'IBM Plex Mono';
    font-style: normal;
    font-weight: 400;
    src: url('__FONTS__/ibm-plex-mono-400.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    font-style: normal;
    font-weight: 500;
    src: url('__FONTS__/ibm-plex-mono-500.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    font-style: normal;
    font-weight: 600;
    src: url('__FONTS__/ibm-plex-mono-600.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Sans';
    font-style: normal;
    font-weight: 400 600;
    src: url('__FONTS__/ibm-plex-sans-variable.woff2') format('woff2');
  }

  :root {
__TOKENS__
    --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    --font-sans: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    width: 1280px;
    height: 720px;
    overflow: hidden;
    background: var(--color-bg);
    color: var(--color-text);
  }

  .cover {
    width: 100%;
    height: 100%;
    padding: 44px 62px 40px;
    display: flex;
    flex-direction: column;
    font-family: var(--font-mono);
  }

  .cover-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 17px;
    color: var(--color-text-muted);
  }

  .cover-status { display: inline-flex; align-items: center; gap: 10px; }
  .cover-status i {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--color-accent);
  }

  .cover-main {
    display: flex;
    align-items: stretch;
    gap: 30px;
    flex: 1;
    min-height: 0;
  }

  .cover-left {
    flex: 0 0 54%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
  }

  .cover-label {
    font-size: 20px;
    letter-spacing: 0.04em;
    color: var(--color-accent);
    opacity: 0.85;
  }

  .cover-rule {
    width: 66px;
    height: 3px;
    margin: 16px 0 24px;
    background: var(--color-accent);
    opacity: 0.35;
  }

  .cover-title {
    margin: 0 0 20px;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 88px;
    line-height: 1.04;
    letter-spacing: -0.01em;
    color: var(--color-text);
    overflow-wrap: break-word;
  }

  .cover-tagline {
    margin: 0 0 42px;
    max-width: 34rem;
    font-family: var(--font-sans);
    font-size: 27px;
    line-height: 1.5;
    color: var(--color-text-muted);
  }

  .cover-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 22px 52px;
  }

  .stat__label {
    font-family: var(--font-mono);
    font-size: 14px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--color-text-muted);
  }

  .stat__value {
    margin-top: 8px;
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 31px;
    color: var(--color-text);
  }

  .cover-focal {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Fallback when a project has no custom focal asset yet: an honest
     typographic monogram, not decorative noise. */
  .focal-monogram {
    width: 100%;
    max-width: 480px;
    border: 1px solid var(--color-border-strong);
    border-radius: 16px;
    padding: 56px 40px;
    text-align: center;
    font-family: var(--font-mono);
  }
  .focal-monogram .mono-sig {
    font-size: 74px;
    font-weight: 600;
    color: var(--color-accent);
  }
  .focal-monogram .mono-note {
    margin-top: 20px;
    font-size: 17px;
    color: var(--color-text-muted);
  }

  .cover-foot {
    display: flex;
    justify-content: space-between;
    margin-top: 26px;
    font-size: 17px;
    color: var(--color-text-muted);
  }
</style>
</head>
<body>
  <div class="cover" id="cover"></div>

  <script>
    window.__COVER__ = __CONFIG__;
  </script>

  <script>
    (function () {
      var cfg = window.__COVER__ || {};
      function esc(s) {
        return String(s).replace(/[&<>"]/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
      }
      var stats = (cfg.stats || []).slice(0, 3).map(function (s) {
        return '<div class="stat">' +
          '<div class="stat__label">' + esc(s.label) + '</div>' +
          '<div class="stat__value">' + esc(s.value) + '</div>' +
          '</div>';
      }).join('');

      var focal = cfg.focalHtml ||
        '<div class="focal-monogram">' +
        '<div class="mono-sig">' + esc((cfg.title || '?').slice(0, 1)) + '</div>' +
        '<div class="mono-note">no focal asset yet — regenerate once available</div>' +
        '</div>';

      document.getElementById('cover').innerHTML =
        '<header class="cover-top">' +
        '<span class="cover-path">' + esc(cfg.path || '') + '</span>' +
        (cfg.status ? '<span class="cover-status"><i></i>' + esc(cfg.status) + '</span>' : '') +
        '</header>' +
        '<main class="cover-main">' +
        '<section class="cover-left">' +
        (cfg.label ? '<div class="cover-label">' + esc(cfg.label) + '</div><div class="cover-rule"></div>' : '') +
        '<h1 class="cover-title">' + esc(cfg.title) + '</h1>' +
        (cfg.tagline ? '<p class="cover-tagline">' + esc(cfg.tagline) + '</p>' : '') +
        '<div class="cover-stats">' + stats + '</div>' +
        '</section>' +
        '<section class="cover-focal">' + focal + '</section>' +
        '</main>' +
        '<footer class="cover-foot">' +
        '<span>' + esc(cfg.footerLeft || '') + '</span>' +
        '<span>' + esc(cfg.footerRight || '') + '</span>' +
        '</footer>';

      // Keep the left column inside the canvas: shrink title/tagline until
      // the block fits, so long titles never push stats out of frame.
      var left = document.querySelector('.cover-left');
      var title = document.querySelector('.cover-title');
      var tagline = document.querySelector('.cover-tagline');
      var guard = 40;
      while (left.scrollHeight > left.clientHeight + 1 && guard-- > 0) {
        var tf = parseFloat(getComputedStyle(title).fontSize);
        if (tf > 56) {
          title.style.fontSize = (tf - 2) + 'px';
        } else if (tagline) {
          var gf = parseFloat(getComputedStyle(tagline).fontSize);
          if (gf <= 21) break;
          tagline.style.fontSize = (gf - 1) + 'px';
        } else {
          break;
        }
      }
    })();
  </script>
</body>
</html>
