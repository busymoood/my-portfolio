# myPortfolio — déploiement du site sur un VPS.
#
# Le site ne publie aucun port : il rejoint le réseau Docker du tunnel
# Cloudflare déjà en place sur le VPS. Le conteneur du tunnel peut alors le
# joindre via http://portfolio-web:80.
#
# Prérequis :
#   - le compose cloudflared tourne déjà sur le VPS ;
#   - TUNNEL_NETWORK contient le nom exact de son réseau Docker
#     (`docker network ls`, souvent <projet>_default ou un nom explicite).
#
# Usage :
#   export TUNNEL_NETWORK=cloudflared_default
#   docker compose -f deploy/docker-compose.vps.yml pull
#   docker compose -f deploy/docker-compose.vps.yml up -d --no-build
#
# Dans Cloudflare : public hostname -> http://portfolio-web:80

name: my-portfolio

services:
  web:
    image: ghcr.io/busymoood/my-portfolio:latest
    container_name: portfolio-web
    restart: unless-stopped
    networks:
      tunnel:
        aliases:
          - portfolio-web

networks:
  tunnel:
    external: true
    name: "${TUNNEL_NETWORK:?Set TUNNEL_NETWORK to the Docker network of your cloudflared container (docker network ls)}"
