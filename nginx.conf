server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fichiers statiques + assets Astro (cache long, empreinté par le hash)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # CV PDF : toujours revalider. Sans cela Cloudflare met les .pdf en cache
    # 4 h et continue de servir la Release précédente après un déploiement.
    # (La page /cv ajoute en plus un hash de contenu dans l'URL.)
    location /pdf/ {
        expires -1;
    }

    # 404 maison (libellée /404.html générée par Astro)
    error_page 404 /404.html;

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
